<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜庆版 Hello World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="fireworks" aria-hidden="true"></div>
    <main class="card" role="main">
      <p class="tag">🧧 新春快乐 · Happy New Year</p>
      <h1>Hello World</h1>
      <p id="blessing" class="blessing" aria-live="polite">愿你岁岁平安，万事胜意！</p>
      <button id="nextBlessing" type="button" aria-label="切换祝福语">换一句祝福</button>
    </main>

    <div class="lantern lantern-left" aria-hidden="true"></div>
    <div class="lantern lantern-right" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
