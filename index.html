<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜庆版 Hello World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="banner" role="banner">
      <h1>🎉 Hello World · 喜庆版</h1>
      <p>吉庆有余，万事胜意</p>
    </header>

    <main id="main" class="main" aria-live="polite">
      <section class="hero" aria-label="节庆主视觉">
        <div class="lantern lantern-left" aria-hidden="true">🏮</div>
        <div class="lantern lantern-right" aria-hidden="true">🏮</div>
        <div class="fireworks" aria-hidden="true" id="fireworks"></div>
        <h2>Hello World，吉庆有余，万事胜意！</h2>
        <p>Wishing you joy, prosperity and bright fireworks in every season.</p>
        <button id="fire-btn" class="btn">再来一束烟花</button>
      </section>
    </main>

    <footer class="footer">
      <small>© 2026 Festive Hello World · 支持键盘操作与减少动态偏好</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
