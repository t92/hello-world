<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>喜庆版 Hello World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="hero-banner" role="banner">
      <p class="hero-subtitle">新春快乐 · 欢庆时刻</p>
      <h1>🎉 Hello World，吉庆有余，万事胜意！</h1>
      <p class="hero-desc">A festive Chinese celebration themed Hello World page</p>
    </header>

    <main id="main" class="main-content" tabindex="-1">
      <section class="scene" aria-label="节庆主视觉">
        <div class="lantern lantern-left" aria-hidden="true"></div>
        <div class="lantern lantern-right" aria-hidden="true"></div>
        <div id="fireworks" class="fireworks" aria-hidden="true"></div>

        <article class="blessing-card" aria-labelledby="blessing-title">
          <h2 id="blessing-title">新年祝福</h2>
          <p>愿你在新的一年：所念皆所愿，所行皆坦途。</p>
          <p>May joy, health, and prosperity be with you all year long.</p>
        </article>

        <button id="burstBtn" class="cta-btn" type="button">
          再来一束烟花 ✨
        </button>
      </section>
    </main>

    <footer class="page-footer">
      <small>© 2026 Festive Hello World · 支持键盘访问与减少动态偏好</small>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
