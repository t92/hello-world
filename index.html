<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRAZY HELLO WORLD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="panic-on">
  <div class="noise" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <main class="stage" role="main">
    <p class="kicker">SYSTEM INSTABILITY // BEAUTIFUL CHAOS</p>
    <h1 class="hero" data-text="HELLO WORLD">HELLO WORLD</h1>
    <p class="sub">Loud visuals, readable core. Toggle the madness.</p>

    <section class="controls" aria-label="effect controls">
      <button id="panicBtn" class="btn danger" aria-pressed="true">PANIC ON</button>
      <button id="shakeBtn" class="btn warn">SHAKE ++</button>
      <button id="calmBtn" class="btn calm">CALM MODE</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
