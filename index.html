<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>癫狂版 Hello World</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-live="polite">
      <p class="noise">SYSTEM OVERDRIVE // BEAUTIFUL CHAOS</p>
      <h1 class="glitch" data-text="HELLO WORLD">HELLO WORLD</h1>
      <p class="sub">欢迎来到<strong>失真宇宙</strong>：疯狂是外壳，可读才是底线。</p>
      <button id="cta" class="cta">点我启动混沌</button>

      <section class="cards" aria-label="chaos cards">
        <article class="card">霓虹撕裂</article>
        <article class="card">反差文案</article>
        <article class="card">可用优先</article>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
